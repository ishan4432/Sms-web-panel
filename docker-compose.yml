version: "3.9"

services:

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  smpp-server:
    build: .
    command: python smpp_server/server.py
    ports:
      - "2776:2776"
    depends_on:
      - redis

  worker:
    build: .
    command: python worker.py
    depends_on:
      - redis

  api:
    build: .
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    depends_on:
      - redis

